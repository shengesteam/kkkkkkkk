<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>教程页面</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --ink:#111827;
  --muted:#6b7280;
  --line:#e6e8ec;
  --accent:#4f46e5;
  --accent2:#0ea5e9;
  --bg:#f5f6f8;
}
html,body{min-height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink);
  background:var(--bg);
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ---------- 顶栏 ---------- */
.top{
  position:sticky;top:0;z-index:100;
  background:rgba(255,255,255,.86);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}
header{
  display:flex;align-items:center;justify-content:flex-end;
  gap:16px;padding:12px 24px;flex-wrap:wrap;
}
.hright{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}

.badge{
  display:inline-flex;align-items:center;gap:7px;
  font-size:12.5px;color:var(--muted);
  padding:6px 12px;border-radius:999px;
  background:#fff;border:1px solid var(--line);
}
.badge i{width:7px;height:7px;border-radius:50%;background:#9ca3af;display:block;}
.badge.live{color:var(--accent);border-color:rgba(79,70,229,.35);background:rgba(79,70,229,.06);}
.badge.live i{background:var(--accent);box-shadow:0 0 8px rgba(79,70,229,.7);animation:pulse 1.6s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.btn{
  font-family:inherit;font-size:13.5px;font-weight:600;color:#fff;
  padding:9px 16px;border-radius:10px;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 8px 20px -10px rgba(79,70,229,.9);
  transition:.16s;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 12px 24px -10px rgba(79,70,229,1);}
.btn.ghost{
  background:#fff;border:1px solid var(--line);
  box-shadow:none;color:#374151;
}
.btn.ghost:hover{background:#f9fafb;}

/* ---------- 工具栏 ---------- */
.toolbar{
  display:none;align-items:center;gap:12px;flex-wrap:wrap;
  padding:9px 24px 11px;
  border-top:1px solid #f1f2f4;
}
body.editing .toolbar{display:flex;}
.tgroup{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.tsep{width:1px;height:20px;background:var(--line);}
.tbtn{
  font-family:inherit;font-size:13px;color:#374151;cursor:pointer;white-space:nowrap;
  padding:7px 12px;border-radius:8px;
  background:#fff;border:1px solid var(--line);
  transition:.14s;
}
.tbtn:hover{background:#f5f3ff;border-color:rgba(79,70,229,.4);color:var(--accent);}
.tbtn.accent{background:rgba(79,70,229,.08);border-color:rgba(79,70,229,.35);color:var(--accent);}
.tbtn.danger:hover{background:#fef2f2;border-color:rgba(239,68,68,.4);color:#dc2626;}

/* ---------- 画布 ---------- */
.stage-wrap{position:relative;width:100%;padding-top:30px;}
.stage{
  position:absolute;top:30px;left:50%;
  width:1280px;height:720px;
  transform-origin:top center;
  border-radius:18px;
  overflow:hidden;
  background:#fff;
  border:1px solid var(--line);
  box-shadow:0 30px 70px -40px rgba(17,24,39,.35);
}
.stage::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(17,24,39,.11) 1px, transparent 1px);
  background-size:24px 24px;
  opacity:0;transition:opacity .2s;
}
body.editing .stage::before{opacity:1;}

/* ---------- 元素 ---------- */
.el{position:absolute;color:var(--ink);}
body.editing .el{user-select:none;-webkit-user-select:none;touch-action:none;cursor:grab;}
body.editing .el.dragging{cursor:grabbing;}
body.editing .el [contenteditable="true"]{user-select:text;-webkit-user-select:text;}
.el-body{width:100%;height:100%;overflow:hidden;}
.el.sel{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;}
.handle{
  position:absolute;right:-7px;bottom:-7px;width:14px;height:14px;border-radius:50%;
  background:var(--accent);border:2px solid #fff;cursor:nwse-resize;display:none;z-index:20;
  box-shadow:0 0 8px rgba(79,70,229,.8);
}
.el.sel .handle{display:block;}

/* 标题 */
.el-title{font-weight:800;line-height:1.15;letter-spacing:-1px;}

/* 正文 */
.el-text{line-height:1.6;font-weight:400;}

/* 卡片 */
.el-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:0 12px 30px -24px rgba(17,24,39,.5);
}
.el-card>.el-body{padding:20px 22px;}
.c-title{font-size:19px;font-weight:700;margin-bottom:9px;color:inherit;}
.c-desc{font-size:15.5px;line-height:1.8;color:inherit;opacity:.65;}

/* 提示条 */
.el-tip{
  background:#eff6ff;
  border:1px solid #dbeafe;
  border-left:4px solid #3b82f6;
  border-radius:10px;
  color:#1e40af;
  font-size:17px;
  line-height:1.6;
}
.el-tip>.el-body{padding:0 18px;display:flex;align-items:center;}

/* 图片 */
.el-img{overflow:hidden;border-radius:12px;border:1px solid var(--line);}
.el-img img{width:100%;height:100%;object-fit:cover;display:block;}

/* 可编辑 */
.editable{outline:none;}
.editable[contenteditable="true"]{
  background:rgba(79,70,229,.08);
  box-shadow:0 0 0 1px rgba(79,70,229,.5);
  border-radius:4px;
}

/* ---------- 属性条 ---------- */
.props{
  position:fixed;left:50%;bottom:20px;transform:translateX(-50%);
  z-index:200;display:none;align-items:center;gap:12px;
  padding:8px 14px;border-radius:14px;
  background:#fff;
  border:1px solid var(--line);
  box-shadow:0 20px 50px -20px rgba(17,24,39,.3);
  flex-wrap:wrap;justify-content:center;max-width:94vw;
}
.props.show{display:flex;}
.ptitle{font-size:12px;color:var(--muted);}
.pgroup{display:flex;align-items:center;gap:5px;}
.pbtn{
  font-family:inherit;font-size:12.5px;color:#374151;cursor:pointer;
  padding:6px 10px;border-radius:7px;
  background:#fff;border:1px solid var(--line);
  transition:.14s;
}
.pbtn:hover{background:#f5f3ff;border-color:rgba(79,70,229,.4);color:var(--accent);}
.pbtn.danger:hover{background:#fef2f2;border-color:rgba(239,68,68,.4);color:#dc2626;}
.pval{font-size:12.5px;color:#374151;min-width:22px;text-align:center;}
.pcolor{
  width:28px;height:28px;border-radius:8px;overflow:hidden;cursor:pointer;
  border:1px solid var(--line);display:block;
}
.pcolor input{width:200%;height:200%;margin:-50%;border:none;background:none;cursor:pointer;padding:0;}

/* ---------- Toast ---------- */
#toast{
  position:fixed;left:50%;bottom:92px;transform:translate(-50%,12px);
  z-index:999;padding:11px 20px;border-radius:11px;
  font-size:13.5px;color:#fff;
  background:#1f2937;
  box-shadow:0 18px 44px -16px rgba(17,24,39,.6);
  opacity:0;pointer-events:none;transition:.24s;max-width:86vw;text-align:center;
}
#toast.show{opacity:1;transform:translate(-50%,0);}

/* ---------- 移动端 ---------- */
.mobile-tip{
  display:none;margin:14px auto 0;max-width:520px;text-align:center;
  font-size:12.5px;color:var(--muted);padding:0 24px;
}
@media (max-width:760px){
  header{padding:10px 14px;}
  .toolbar{padding:8px 14px 10px;}
  .hright .badge{display:none;}
  .mobile-tip{display:block;}
  .stage-wrap{padding-top:16px;}
  .props{bottom:10px;gap:8px;padding:7px 10px;}
}
</style>
</head>
<body>

<div class="top">
  <header>
    <div class="hright">
      <span class="badge" id="badge"><i></i>只读模式</span>
      <button class="btn" id="btnEditMode">✏️ 进入编辑</button>
      <button class="btn ghost" id="btnExitEdit" style="display:none">退出编辑</button>
    </div>
  </header>

  <div class="toolbar" id="toolbar">
    <div class="tgroup">
      <button class="tbtn" data-add="title">＋ 标题</button>
      <button class="tbtn" data-add="text">＋ 文本</button>
      <button class="tbtn" data-add="card">＋ 卡片</button>
      <button class="tbtn" data-add="tip">＋ 提示</button>
      <button class="tbtn" data-add="image">＋ 图片</button>
    </div>
    <div class="tsep"></div>
    <div class="tgroup">
      <button class="tbtn" id="btnSnap">吸附：开</button>
      <button class="tbtn" id="btnSave">💾 保存</button>
      <button class="tbtn accent" id="btnShare">🔗 分享</button>
      <button class="tbtn danger" id="btnReset">↺ 恢复默认</button>
    </div>
  </div>
</div>

<div class="stage-wrap" id="stageWrap">
  <div class="stage" id="stage"></div>
  <div class="mobile-tip">手机上仅可查看，编辑排版建议使用电脑。</div>
</div>

<div class="props" id="props">
  <span class="ptitle">已选中</span>
  <div class="pgroup">
    <button class="pbtn" data-prop="fs-">A−</button>
    <span class="pval" id="fsVal">16</span>
    <button class="pbtn" data-prop="fs+">A+</button>
  </div>
  <label class="pcolor" title="文字颜色"><input type="color" id="colorPick" value="#111827"></label>
  <div class="pgroup">
    <button class="pbtn" data-prop="front">置顶</button>
    <button class="pbtn" data-prop="back">置底</button>
    <button class="pbtn" data-prop="dup">复制</button>
    <button class="pbtn" data-prop="img" style="display:none">换图</button>
    <button class="pbtn danger" data-prop="del">删除</button>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*" hidden>

<script>
(function () {
'use strict';

/* ==================== 配置 ==================== */
const STAGE_W = 1280;
const STAGE_H = 720;
const STORAGE_KEY = 'tutorial_page_v1';
const PASSWORD = '8888';            // ← 改这里即可更换编辑密码

/* ==================== 状态 ==================== */
let state = { elements: [] };
let editing = false;
let selectedId = null;
let snap = true;
let scale = 1;

const $ = s => document.querySelector(s);
const stage = $('#stage');
const stageWrap = $('#stageWrap');
const props = $('#props');
const badge = $('#badge');
const fileInput = $('#fileInput');

/* ==================== 工具 ==================== */
const uid = () => 'e' + Math.random().toString(36).slice(2, 9);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const getEl = id => state.elements.find(e => e.id === id);
const maxZ = () => state.elements.reduce((m, e) => Math.max(m, e.z || 0), 0);
const minZ = () => state.elements.reduce((m, e) => Math.min(m, e.z || 0), 0);

function toast(msg, ms) {
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), ms || 2400);
}

/* ==================== Base64（中文安全） ==================== */
function toB64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  const CH = 0x8000;
  for (let i = 0; i < bytes.length; i += CH) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  }
  return btoa(bin);
}
function fromB64(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

/* ==================== 默认排版（已加大字号） ==================== */
function defaultData() {
  return {
    elements: [
      {
        id: uid(), x: 80, y: 48, w: 800, h: 68, z: 1,
        cls: 'el-title', fs: 54,
        html: '<div class="editable">产品使用教程</div>'
      },
      {
        id: uid(), x: 82, y: 132, w: 800, h: 30, z: 2,
        cls: 'el-text', fs: 19, color: '#6b7280',
        html: '<div class="editable">从零开始，三步完成配置。页面由群主编辑，访客只读。</div>'
      },
      {
        id: uid(), x: 80, y: 182, w: 360, h: 190, z: 3, cls: 'el-card',
        html:
          '<div class="c-title editable">01 · 创建项目</div>' +
          '<div class="c-desc editable">登录控制台，点击「新建项目」，填写名称与描述后确认创建。</div>'
      },
      {
        id: uid(), x: 460, y: 182, w: 360, h: 190, z: 4, cls: 'el-card',
        html:
          '<div class="c-title editable">02 · 配置参数</div>' +
          '<div class="c-desc editable">在设置页调整基础选项与权限，保存后自动生效，无需重启。</div>'
      },
      {
        id: uid(), x: 840, y: 182, w: 360, h: 190, z: 5, cls: 'el-card',
        html:
          '<div class="c-title editable">03 · 发布上线</div>' +
          '<div class="c-desc editable">点击发布按钮，等待构建完成，即可通过链接访问你的项目。</div>'
      },
      {
        id: uid(), x: 80, y: 394, w: 1120, h: 62, z: 6, cls: 'el-tip',
        html: '<div class="editable">💡 提示：双击任意文字即可修改，拖动可调整位置，右下角可缩放。</div>'
      },
      {
        id: uid(), x: 80, y: 478, w: 1120, h: 220, z: 7, cls: 'el-card',
        html:
          '<div class="c-title editable">常见问题</div>' +
          '<div class="c-desc editable">Q：为什么我看不到编辑按钮？<br>' +
          'A：访客模式默认只读，需要输入密码才能进入编辑。<br><br>' +
          'Q：分享出去的链接会同步我的修改吗？<br>' +
          'A：链接保存的是分享那一刻的内容，之后修改需重新分享。</div>'
      }
    ]
  };
}

/* ==================== 渲染 ==================== */
function buildEl(el) {
  const node = document.createElement('div');
  node.className = 'el ' + (el.cls || '');
  node.dataset.id = el.id;
  node.style.left = el.x + 'px';
  node.style.top = el.y + 'px';
  node.style.width = el.w + 'px';
  node.style.height = el.h + 'px';
  node.style.zIndex = el.z || 1;
  if (el.fs) node.style.fontSize = el.fs + 'px';
  if (el.color) node.style.color = el.color;

  const body = document.createElement('div');
  body.className = 'el-body';
  body.innerHTML = el.html || '';
  node.appendChild(body);

  const handle = document.createElement('div');
  handle.className = 'handle';
  node.appendChild(handle);

  return node;
}

function renderAll() {
  stage.innerHTML = '';
  [...state.elements].sort((a, b) => (a.z || 0) - (b.z || 0))
    .forEach(el => stage.appendChild(buildEl(el)));
  applySelection();
}

function applySelection() {
  stage.querySelectorAll('.el').forEach(n => {
    n.classList.toggle('sel', n.dataset.id === selectedId);
  });
  updateProps();
}

/* ==================== 自适应缩放 ==================== */
function layout() {
  const availW = (stageWrap.clientWidth || window.innerWidth) - 64;
  scale = clamp(availW / STAGE_W, 0.12, 1);
  stage.style.transform = 'translateX(-50%) scale(' + scale + ')';
  stageWrap.style.height = (STAGE_H * scale + 30 + 60) + 'px';
}

/* ==================== 选中 / 属性条 ==================== */
function select(id) {
  selectedId = id;
  applySelection();
}

function updateProps() {
  const el = selectedId ? getEl(selectedId) : null;
  if (!editing || !el) { props.classList.remove('show'); return; }
  props.classList.add('show');
  $('#fsVal').textContent = el.fs || 16;
  const cp = $('#colorPick');
  cp.value = /^#[0-9a-f]{6}$/i.test(el.color || '') ? el.color : '#111827';
  const imgBtn = props.querySelector('[data-prop="img"]');
  imgBtn.style.display = (el.cls || '').indexOf('el-img') > -1 ? '' : 'none';
}

/* ==================== 拖拽 ==================== */
function startDrag(e, node, el) {
  const sx = e.clientX, sy = e.clientY, ox = el.x, oy = el.y;
  let moved = false;

  function onMove(ev) {
    const dx = ev.clientX - sx, dy = ev.clientY - sy;
    if (!moved && Math.abs(dx) < 3 && Math.abs(dy) < 3) return;
    moved = true;
    node.classList.add('dragging');
    let nx = ox + dx / scale;
    let ny = oy + dy / scale;
    if (snap) { nx = Math.round(nx / 8) * 8; ny = Math.round(ny / 8) * 8; }
    el.x = Math.round(nx);
    el.y = Math.round(ny);
    node.style.left = el.x + 'px';
    node.style.top = el.y + 'px';
  }
  function onUp() {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    node.classList.remove('dragging');
  }
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
}

/* ==================== 缩放 ==================== */
function startResize(e, node, el) {
  e.preventDefault();
  e.stopPropagation();
  const sx = e.clientX, sy = e.clientY, ow = el.w, oh = el.h;

  function onMove(ev) {
    let nw = ow + (ev.clientX - sx) / scale;
    let nh = oh + (ev.clientY - sy) / scale;
    if (snap) { nw = Math.round(nw / 8) * 8; nh = Math.round(nh / 8) * 8; }
    el.w = Math.round(clamp(nw, 60, STAGE_W));
    el.h = Math.round(clamp(nh, 32, STAGE_H));
    node.style.width = el.w + 'px';
    node.style.height = el.h + 'px';
  }
  function onUp() {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
  }
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
}

/* ==================== 画布交互 ==================== */
stage.addEventListener('pointerdown', function (e) {
  if (!editing) return;
  const node = e.target.closest('.el');
  if (!node) { select(null); return; }
  if (e.target.isContentEditable) return;

  const el = getEl(node.dataset.id);
  if (!el) return;

  select(el.id);

  if (e.target.classList.contains('handle')) {
    startResize(e, node, el);
    return;
  }
  startDrag(e, node, el);
});

/* 双击编辑文字 */
stage.addEventListener('dblclick', function (e) {
  if (!editing) return;
  const target = e.target.closest('.editable');
  if (!target || target.isContentEditable) return;

  target.contentEditable = 'true';
  target.focus();

  try {
    const r = document.createRange();
    r.selectNodeContents(target);
    r.collapse(false);
    const s = window.getSelection();
    s.removeAllRanges();
    s.addRange(r);
  } catch (err) {}

  target.addEventListener('blur', function onBlur() {
    target.removeEventListener('blur', onBlur);
    target.contentEditable = 'false';
    syncFromDOM();
  });
});

/* DOM → 数据 */
function syncFromDOM() {
  stage.querySelectorAll('.el').forEach(node => {
    const el = getEl(node.dataset.id);
    if (!el) return;
    const body = node.querySelector('.el-body');
    if (!body) return;
    body.querySelectorAll('[contenteditable]').forEach(n => n.removeAttribute('contenteditable'));
    el.html = body.innerHTML;
  });
}

/* 粘贴纯文本 */
document.addEventListener('paste', function (e) {
  const ae = document.activeElement;
  if (!ae || !ae.isContentEditable) return;
  e.preventDefault();
  const text = (e.clipboardData || window.clipboardData).getData('text/plain');
  document.execCommand('insertText', false, text);
});

/* ==================== 属性条 ==================== */
props.addEventListener('click', function (e) {
  const btn = e.target.closest('[data-prop]');
  if (!btn) return;
  const el = getEl(selectedId);
  if (!el) return;
  const p = btn.dataset.prop;

  if (p === 'fs+') { el.fs = clamp((el.fs || 16) + 2, 8, 200); }
  else if (p === 'fs-') { el.fs = clamp((el.fs || 16) - 2, 8, 200); }
  else if (p === 'front') { el.z = maxZ() + 1; }
  else if (p === 'back') { el.z = minZ() - 1; }
  else if (p === 'dup') {
    syncFromDOM();
    const copy = JSON.parse(JSON.stringify(el));
    copy.id = uid();
    copy.x = el.x + 24;
    copy.y = el.y + 24;
    copy.z = maxZ() + 1;
    state.elements.push(copy);
    renderAll();
    select(copy.id);
    return;
  }
  else if (p === 'del') {
    state.elements = state.elements.filter(x => x.id !== el.id);
    selectedId = null;
    renderAll();
    return;
  }
  else if (p === 'img') {
    pickImage(function (dataUrl) {
      el.html = '<img src="' + dataUrl + '" alt="">';
      renderAll();
      select(el.id);
    });
    return;
  }

  renderAll();
  select(el.id);
});

$('#colorPick').addEventListener('input', function (e) {
  const el = getEl(selectedId);
  if (!el) return;
  el.color = e.target.value;
  const node = stage.querySelector('.el[data-id="' + el.id + '"]');
  if (node) node.style.color = el.color;
});

/* ==================== 添加元素（字号已加大） ==================== */
function addElement(type) {
  if (type === 'image') {
    pickImage(function (dataUrl) {
      state.elements.push({
        id: uid(), x: 300, y: 200, w: 360, h: 240, z: maxZ() + 1,
        cls: 'el-img',
        html: '<img src="' + dataUrl + '" alt="">'
      });
      renderAll();
      toast('图片已添加');
    });
    return;
  }

  const el = {
    id: uid(),
    x: 160 + Math.round(Math.random() * 100),
    y: 120 + Math.round(Math.random() * 100),
    z: maxZ() + 1
  };

  if (type === 'title') {
    Object.assign(el, {
      w: 560, h: 68, cls: 'el-title', fs: 48,
      html: '<div class="editable">标题文字</div>'
    });
  } else if (type === 'text') {
    Object.assign(el, {
      w: 520, h: 46, cls: 'el-text', fs: 19,
      html: '<div class="editable">双击这里输入正文内容。</div>'
    });
  } else if (type === 'card') {
    Object.assign(el, {
      w: 340, h: 180, cls: 'el-card',
      html: '<div class="c-title editable">卡片标题</div>' +
            '<div class="c-desc editable">双击编辑描述内容，拖动可调整位置。</div>'
    });
  } else if (type === 'tip') {
    Object.assign(el, {
      w: 640, h: 62, cls: 'el-tip',
      html: '<div class="editable">💡 这是一条提示信息。</div>'
    });
  }

  state.elements.push(el);
  renderAll();
  select(el.id);
  toast('已添加，双击可编辑');
}

/* ==================== 图片压缩上传 ==================== */
function pickImage(callback) {
  fileInput.value = '';
  fileInput.onchange = function () {
    const file = fileInput.files && fileInput.files[0];
    if (!file) return;
    if (!/^image\//.test(file.type)) { toast('请选择图片文件'); return; }

    const reader = new FileReader();
    reader.onload = function () {
      const img = new Image();
      img.onload = function () {
        let w = img.width, h = img.height;
        const MAX = 1100;
        if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        callback(c.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = function () { toast('图片读取失败'); };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  };
  fileInput.click();
}

/* ==================== 保存 / 分享 ==================== */
function saveLocal(silent) {
  syncFromDOM();
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    if (!silent) toast('已保存到本机 ✅');
  } catch (err) {
    toast('保存失败，图片可能过大 😢', 3200);
  }
}

function shareLink() {
  syncFromDOM();
  saveLocal(true);
  const b64 = toB64(JSON.stringify(state));
  const url = location.href.split('#')[0] + '#t=' + encodeURIComponent(b64);

  const done = () => toast('只读链接已复制，发给别人即可查看 🔗', 3000);
  const fail = () => window.prompt('复制下面的只读链接：', url);

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(done, fail);
  } else {
    fail();
  }

  if (url.length > 28000) {
    setTimeout(() => toast('⚠️ 链接较长（' + url.length + ' 字符），部分软件可能截断', 4000), 1200);
  }
}

/* ==================== 模式切换 ==================== */
function setEditing(v) {
  editing = v;
  document.body.classList.toggle('editing', v);
  badge.classList.toggle('live', v);
  badge.innerHTML = v ? '<i></i>编辑模式' : '<i></i>只读模式';
  $('#btnEditMode').style.display = v ? 'none' : '';
  $('#btnExitEdit').style.display = v ? '' : 'none';

  if (!v) {
    syncFromDOM();
    select(null);
  }
  props.classList.remove('show');
  layout();
}

/* ==================== 事件绑定 ==================== */
$('#btnEditMode').addEventListener('click', function () {
  const pwd = prompt('请输入编辑密码：');
  if (pwd === null) return;
  if (pwd.trim() !== PASSWORD) { toast('密码不正确'); return; }
  setEditing(true);
  toast('已进入编辑模式：拖动 / 双击试试');
});

$('#btnExitEdit').addEventListener('click', function () {
  saveLocal(true);
  setEditing(false);
  toast('已退出编辑，内容已保存 ✅');
});

document.querySelectorAll('[data-add]').forEach(btn => {
  btn.addEventListener('click', () => addElement(btn.dataset.add));
});

$('#btnSnap').addEventListener('click', function () {
  snap = !snap;
  this.textContent = '吸附：' + (snap ? '开' : '关');
});

$('#btnSave').addEventListener('click', () => saveLocal(false));
$('#btnShare').addEventListener('click', shareLink);

$('#btnReset').addEventListener('click', function () {
  if (!confirm('确定恢复默认排版吗？当前内容会丢失（建议先保存或分享备份）。')) return;
  state = defaultData();
  selectedId = null;
  renderAll();
  saveLocal(true);
  toast('已恢复默认排版');
});

/* 快捷键 */
document.addEventListener('keydown', function (e) {
  if (!editing || !selectedId) return;
  const ae = document.activeElement;
  if (ae && ae.isContentEditable) return;

  const el = getEl(selectedId);
  if (!el) return;

  if (e.key === 'Delete' || e.key === 'Backspace') {
    e.preventDefault();
    state.elements = state.elements.filter(x => x.id !== el.id);
    selectedId = null;
    renderAll();
    return;
  }
  if (e.key === 'Escape') { select(null); return; }

  const step = e.shiftKey ? 10 : 1;
  if (e.key === 'ArrowUp') { e.preventDefault(); el.y -= step; }
  else if (e.key === 'ArrowDown') { e.preventDefault(); el.y += step; }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); el.x -= step; }
  else if (e.key === 'ArrowRight') { e.preventDefault(); el.x += step; }
  else return;

  const node = stage.querySelector('.el[data-id="' + el.id + '"]');
  if (node) { node.style.left = el.x + 'px'; node.style.top = el.y + 'px'; }
});

window.addEventListener('resize', layout);

/* ==================== 初始化 ==================== */
function init() {
  let loaded = null;

  if (location.hash.indexOf('#t=') === 0) {
    try {
      loaded = JSON.parse(fromB64(decodeURIComponent(location.hash.slice(3))));
    } catch (err) { console.warn('分享数据解析失败', err); }
    if (loaded) setTimeout(() => toast('这是只读分享页面 👀', 3200), 400);
  }

  if (!loaded) {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) loaded = JSON.parse(raw);
    } catch (err) {}
  }

  if (!loaded || !Array.isArray(loaded.elements) || !loaded.elements.length) {
    loaded = defaultData();
  }

  state = loaded;
  renderAll();
  layout();
  setEditing(false);
}

init();

})();
</script>
